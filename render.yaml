services:
  - type: web
    name: jobcraft-ai
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: true
    disk:
      name: jobcraft-data
      mountPath: /app/server/data
      sizeGB: 1
